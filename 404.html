<!DOCTYPE html>
<html lang="az">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#080808"
  >

  <meta
    name="robots"
    content="noindex, follow"
  >

  <title>
    Səhifə tapılmadı | Bizdə Belədir
  </title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at 50% 0%,
          #303030 0%,
          #151515 35%,
          #080808 75%
        );
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .box {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      overflow: hidden;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #222;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.55);
    }

    .logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .error {
      margin-bottom: 10px;
      font-size: clamp(76px, 24vw, 130px);
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: -6px;
    }

    h1 {
      margin-bottom: 14px;
      font-size: 28px;
      font-weight: 900;
    }

    p {
      max-width: 420px;
      margin: 0 auto 28px;
      color: #aaa;
      font-size: 16px;
      line-height: 1.6;
    }

    .buttons {
      display: grid;
      gap: 10px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 14px 18px;
      border-radius: 17px;
      font-size: 15px;
      font-weight: 900;
      text-decoration: none;
    }

    .home {
      background: #ff0033;
      color: #fff;
    }

    .videos {
      border: 1px solid #303030;
      background: #151515;
      color: #fff;
    }

    .question {
      margin-top: 30px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="box">

    <div class="logo">
      <img
        src="/file_0000000059908210b6e69fc5a5cd05f1.png"
        alt="Bizdə Belədir"
        width="96"
        height="96"
      >
    </div>

    <div class="error">
      404
    </div>

    <h1>
      Deyəsən, burada belə deyil 😄
    </h1>

    <p>
      Axtardığın səhifə tapılmadı.
      Ola bilsin link dəyişib və ya səhifə artıq mövcud deyil.
    </p>

    <div class="buttons">

      <a
        class="button home"
        href="/"
      >
        🏠 Ana səhifəyə qayıt
      </a>

      <a
        class="button videos"
        href="/videos.html"
      >
        🎬 Bütün videolara bax
      </a>

    </div>

    <div class="question">
      Bizdə Belədir 🇦🇿
    </div>

  </main>

</body>

</html>
