
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bizdə Belədir</title>
  <meta name="description" content="Bizdə Belədir — gündəlik həyatdan tanış vəziyyətlər, qısa videolar və yumor. YouTube, Instagram və TikTok-da bizi izlə.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 10%, #292929 0%, #111 38%, #050505 75%);
      color: white;
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 680px;
      padding: 90px 34px 70px;
      text-align: center;
    }

    .tag {
      display: inline-block;
      padding: 10px 20px;
      border: 1px solid #444;
      border-radius: 30px;
      color: #c9c9c9;
      font-size: 16px;
      margin-bottom: 38px;
      background: rgba(255,255,255,0.02);
    }

    h1 {
      font-size: clamp(58px, 13vw, 88px);
      line-height: 0.88;
      letter-spacing: -4px;
      font-weight: 900;
      margin-bottom: 38px;
    }

    h1 span {
      display: block;
      color: #d7d7d7;
    }

    .description {
      color: #aaa;
      font-size: 21px;
      line-height: 1.55;
      max-width: 590px;
      margin: 0 auto 50px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .btn {
      width: 100%;
      min-height: 108px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 34px;
      color: white;
      text-decoration: none;
      font-size: 26px;
      font-weight: 700;
      transition: transform .18s ease, filter .18s ease;
    }

    .btn:active {
      transform: scale(.98);
    }

    .youtube {
      background: #ff0033;
    }

    .instagram {
      background: linear-gradient(
        100deg,
        #833ab4 0%,
        #fd1d1d 52%,
        #fcb045 100%
      );
    }

    .tiktok {
      background: #181818;
      border: 1px solid #3b3b3b;
    }

    .arrow {
      font-size: 30px;
    }

    .footer {
      margin-top: 55px;
      color: #555;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .page {
        padding: 70px 24px 50px;
      }

      .tag {
        font-size: 14px;
      }

      h1 {
        font-size: 60px;
      }

      .description {
        font-size: 18px;
      }

      .btn {
        min-height: 92px;
        font-size: 23px;
        border-radius: 24px;
        padding: 0 28px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="tag">
      🇦🇿 GÜNDƏLİK HƏYAT • MİZAH • VİDEO
    </div>

    <h1>
      BİZDƏ
      <span>BELƏDİR</span>
    </h1>

    <p class="description">
      Hər gün başımıza gələn tanış vəziyyətlər, qısa videolar və bir az da gülüş.
      Baxıb “bu eynən məndə də olur” deyəcəksən.
    </p>

    <div class="links">

      <a
        class="btn youtube"
        href="https://youtube.com/@bizde.beledir?si=G3l2_xXgRBlblG6c"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>YouTube</span>
        <span class="arrow">→</span>
      </a>

      <a
        class="btn instagram"
        href="https://www.instagram.com/bizde.beledir?stkn=MWs0YWlsOWhpcDE4eA=="
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Instagram</span>
        <span class="arrow">→</span>
      </a>

      <a
        class="btn tiktok"
        href="https://www.tiktok.com/@bizde.beledir?_r=1&amp;_t=ZS-9A4xRlrkP5u"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>TikTok</span>
        <span class="arrow">→</span>
      </a>

    </div>

    <div class="footer">
      © 2026 Bizdə Belədir
    </div>

  </main>

</body><img src="file_0000000059908210b6e69fc5a5cd05f1.png" alt="Bizdə Belədir">
</html>
