<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bizdə Belədir</title>
  <meta name="description" content="Bizdə Belədir — gündəlik həyat, yumor və qısa videolar.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, #252525 0%, #111 42%, #000 100%);
      color: white;
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 680px;
      min-height: 100vh;
      padding: 55px 28px 35px;
      text-align: center;
    }

    .tag {
      display: inline-block;
      border: 1px solid #555;
      border-radius: 999px;
      padding: 10px 18px;
      color: #cfcfcf;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .profile {
      width: 125px;
      height: 125px;
      margin: 0 auto 22px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid white;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
      background: #222;
    }

    .profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      font-size: clamp(52px, 13vw, 88px);
      line-height: .88;
      letter-spacing: -4px;
      font-weight: 900;
      margin-bottom: 30px;
    }

    .description {
      max-width: 600px;
      margin: 0 auto 38px;
      color: #bdbdbd;
      font-size: 19px;
      line-height: 1.55;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn {
      min-height: 96px;
      border-radius: 27px;
      padding: 0 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: white;
      font-size: 26px;
      font-weight: 700;
      transition: transform .2s ease, opacity .2s ease;
    }

    .btn:active {
      transform: scale(.97);
      opacity: .9;
    }

    .youtube {
      background: #ff0033;
    }

    .instagram {
      background: linear-gradient(
        110deg,
        #833ab4 0%,
        #c13584 28%,
        #fd1d1d 58%,
        #fcb045 100%
      );
    }

    .tiktok {
      background: #171717;
      border: 1px solid #444;
    }

    .arrow {
      font-size: 34px;
      font-weight: 400;
    }

    .footer {
      margin-top: 35px;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .page {
        padding: 42px 20px 28px;
      }

      .profile {
        width: 110px;
        height: 110px;
      }

      h1 {
        font-size: 58px;
      }

      .description {
        font-size: 17px;
      }

      .btn {
        min-height: 88px;
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="tag">
      🇦🇿 GÜNDƏLİK HƏYAT • MİZAH • VİDEO
    </div>

    <div class="profile">
      <img
        src="file_0000000059908210b6e69fc5a5cd05f1.png"
        alt="Bizdə Belədir"
      >
    </div>

    <h1>
      BİZDƏ<br>
      BELƏDİR
    </h1>

    <p class="description">
      Hər gün başımıza gələn tanış vəziyyətlər, qısa videolar və bir az da gülüş.
      Baxıb “bu eynən məndə də olur” deyəcəksən.
    </p>

    <div class="links">

      <a
        class="btn youtube"
        href="https://youtube.com/@bizde.beledir?si=G3l2_xXgRBlblG6c"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>YouTube</span>
        <span class="arrow">→</span>
      </a>

      <a
        class="btn instagram"
        href="https://www.instagram.com/bizde.beledir?stkn=MWs0YWlsOWhpcDE4eA=="
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Instagram</span>
        <span class="arrow">→</span>
      </a>

      <a
        class="btn tiktok"
        href="https://www.tiktok.com/@bizde.beledir?_r=1&_t=ZS-9A4xRlrkP5u"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>TikTok</span>
        <span class="arrow">→</span>
      </a>

    </div>

    <div class="footer">
      © 2026 Bizdə Belədir
    </div>

  </main>

</body>
</html>
