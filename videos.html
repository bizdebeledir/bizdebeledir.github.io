<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bütün Videolar | Bizdə Belədir</title>

  <meta name="description"
        content="Bizdə Belədir kanalının Azərbaycan yumor və gündəlik həyat videolarına bax.">

  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#080808">

  <link rel="canonical"
        href="https://bizdebeledir.github.io/videos.html">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 30px 18px 60px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #aaa;
      text-decoration: none;
      font-weight: 800;
      margin-bottom: 30px;
    }

    .header {
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(38px, 9vw, 65px);
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 14px;
    }

    .subtitle {
      color: #999;
      font-size: 16px;
      line-height: 1.5;
    }

    .search-box {
      position: relative;
      margin: 28px 0 18px;
    }

    .search-box input {
      width: 100%;
      height: 62px;
      border-radius: 18px;
      border: 1px solid #303030;
      background: #141414;
      color: #fff;
      padding: 0 20px 0 52px;
      font-size: 16px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #666;
    }

    .search-icon {
      position: absolute;
      left: 19px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      pointer-events: none;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 24px;
      color: #888;
      font-size: 14px;
    }

    .count {
      color: #ddd;
      font-weight: 800;
    }

    .videos {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .video-card {
      display: block;
      color: #fff;
      text-decoration: none;
      background: #131313;
      border: 1px solid #292929;
      border-radius: 22px;
      overflow: hidden;
      transition:
        transform .18s ease,
        border-color .18s ease;
    }

    .video-card:active {
      transform: scale(.98);
    }

    .thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #1b1b1b;
      overflow: hidden;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .play {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(0,0,0,.78);
      border: 1px solid rgba(255,255,255,.25);
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 4px;
      font-size: 23px;
    }

    .video-info {
      padding: 17px 18px 19px;
    }

    .video-title {
      font-size: 17px;
      line-height: 1.35;
      font-weight: 800;
      margin-bottom: 12px;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: #888;
      font-size: 13px;
    }

    .views {
      color: #ccc;
      font-weight: 700;
    }

    .empty,
    .loading {
      grid-column: 1 / -1;
      padding: 45px 20px;
      background: #111;
      border: 1px solid #252525;
      border-radius: 22px;
      text-align: center;
      color: #888;
    }

    .youtube-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 500px;
      min-height: 64px;
      margin: 35px auto 0;
      border-radius: 19px;
      background: #ff0033;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 900;
    }

    footer {
      margin-top: 50px;
      padding-top: 28px;
      border-top: 1px solid #202020;
      text-align: center;
      color: #666;
      font-size: 13px;
    }

    @media (min-width: 620px) {
      .videos {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 900px) {
      .videos {
        grid-template-columns: repeat(3, 1fr);
      }

      .video-title {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <a
      class="back"
      href="/">
      ← Bizdə Belədir
    </a>

    <div class="header">

      <h1>🎬 Bütün videolar</h1>

      <p class="subtitle">
        Bizdə Belədir kanalının ən yeni videolarına bax.
        İstədiyin videonu axtar və seç.
      </p>

    </div>

    <div class="search-box">

      <span class="search-icon">🔎</span>

      <input
        id="search"
        type="search"
        placeholder="Video axtar..."
        autocomplete="off"
        aria-label="Video axtar">

    </div>

    <div class="info-row">

      <span>
        🆕 Yenidən köhnəyə
      </span>

      <span
        class="count"
        id="video-count">
        ...
      </span>

    </div>

    <div
      class="videos"
      id="videos">

      <div class="loading">
        Videolar yüklənir...
      </div>

    </div>

    <a
      class="youtube-button"
      href="https://youtube.com/@bizde.beledir/shorts"
      target="_blank"
      rel="noopener noreferrer">
      ▶ YouTube-da bütün Shorts-lara bax
    </a>

    <footer>
      © 2026 BİZDƏ BELƏDİR • Bütün hüquqlar qorunur
    </footer>

  </main>


  <script>
    let allVideos = [];

    const videosContainer =
      document.getElementById("videos");

    const searchInput =
      document.getElementById("search");

    const countElement =
      document.getElementById("video-count");


    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text || "";
      return div.innerHTML;
    }


    function formatViews(number) {
      return new Intl.NumberFormat(
        "az-AZ"
      ).format(
        Number(number) || 0
      );
    }


    function formatDate(dateString) {

      if (!dateString) {
        return "";
      }

      const date =
        new Date(dateString);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "";
      }

      return new Intl.DateTimeFormat(
        "az-AZ",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      ).format(date);
    }


    function createVideoCard(video) {

      const videoPage =
        "video/"
        + encodeURIComponent(video.id)
        + ".html";

      return `
        <a
          class="video-card"
          href="${videoPage}"
        >

          <div class="thumb">

            <img
              src="${video.thumbnail}"
              alt="${escapeHTML(video.title)}"
              loading="lazy"
            >

            <div class="play">
              ▶
            </div>

          </div>

          <div class="video-info">

            <div class="video-title">
              ${escapeHTML(video.title)}
            </div>

            <div class="video-meta">

              <span class="views">
                👁 ${formatViews(video.views)}
              </span>

              <span>
                ${formatDate(video.publishedAt)}
              </span>

            </div>

          </div>

        </a>
      `;
    }


    function renderVideos(videos) {

      countElement.textContent =
        videos.length + " video";

      if (!videos.length) {

        videosContainer.innerHTML = `
          <div class="empty">
            🔎 Bu axtarışa uyğun video tapılmadı.
          </div>
        `;

        return;
      }

      videosContainer.innerHTML =
        videos
          .map(createVideoCard)
          .join("");
    }


    async function loadVideos() {

      try {

        const response = await fetch(
          "all-videos.json?v=" + Date.now(),
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            "all-videos.json yüklənmədi"
          );
        }

        const data =
          await response.json();

        if (
          !Array.isArray(data)
          ||
          !data.length
        ) {
          throw new Error(
            "Video tapılmadı"
          );
        }

        allVideos =
          [...data].sort(
            (a, b) =>
              new Date(b.publishedAt)
              -
              new Date(a.publishedAt)
          );

        renderVideos(
          allVideos
        );

      } catch (error) {

        console.error(error);

        countElement.textContent =
          "0 video";

        videosContainer.innerHTML = `
          <div class="empty">
            Videolar hazırda yüklənə bilmir.
          </div>
        `;
      }
    }


    searchInput.addEventListener(
      "input",
      () => {

        const query =
          searchInput
            .value
            .trim()
            .toLocaleLowerCase("az");

        if (!query) {

          renderVideos(
            allVideos
          );

          return;
        }

        const filtered =
          allVideos.filter(
            video => {

              const title =
                (
                  video.title
                  ||
                  ""
                )
                .toLocaleLowerCase("az");

              const description =
                (
                  video.description
                  ||
                  ""
                )
                .toLocaleLowerCase("az");

              return (
                title.includes(query)
                ||
                description.includes(query)
              );
            }
          );

        renderVideos(
          filtered
        );
      }
    );


    loadVideos();
  </script>

</body>
</html>
