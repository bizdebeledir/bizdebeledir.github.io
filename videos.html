<!DOCTYPE html>
<html lang="az">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- Google Analytics -->
  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-THZTTZJGRJ"
  ></script>

  <script>
    window.dataLayer =
      window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag(
      "js",
      new Date()
    );

    gtag(
      "config",
      "G-THZTTZJGRJ"
    );
  </script>

  <title>Bütün Videolar | Bizdə Belədir</title>

  <meta
    name="description"
    content="Bizdə Belədir kanalının bütün videolarına bax. Azərbaycan gündəlik həyatı, yumor və əyləncəli qısa videolar."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <meta
    name="theme-color"
    content="#080808"
  >

  <link
    rel="canonical"
    href="https://bizdebeledir.github.io/videos.html"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #fff;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 28px 17px 60px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 30px;
    }

    .header {
      margin-bottom: 27px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 9vw, 58px);
      line-height: 1;
      letter-spacing: -2px;
    }

    .subtitle {
      color: #999;
      font-size: 16px;
      line-height: 1.55;
      margin: 0;
    }

    .controls {
      margin: 27px 0 25px;
    }

    .search {
      position: relative;
      margin-bottom: 13px;
    }

    .search input {
      width: 100%;
      min-height: 58px;
      border-radius: 18px;
      border: 1px solid #303030;
      background: #121212;
      color: #fff;
      font-size: 16px;
      padding: 0 18px 0 49px;
      outline: none;
    }

    .search input:focus {
      border-color: #666;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .filter-btn {
      min-height: 52px;
      border: 1px solid #303030;
      border-radius: 16px;
      background: #141414;
      color: #aaa;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      padding: 10px;
    }

    .filter-btn.active {
      background: #fff;
      color: #080808;
      border-color: #fff;
    }

    .results-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 17px;
      color: #888;
      font-size: 13px;
    }

    .results-info strong {
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: #fff;
      background: #121212;
      border: 1px solid #292929;
      border-radius: 21px;
      overflow: hidden;
    }

    .thumbnail {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #1d1d1d;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .play {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(0,0,0,.78);
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 3px;
      font-size: 21px;
    }

    .card-body {
      padding: 16px;
    }

    .title {
      font-size: 16px;
      line-height: 1.4;
      font-weight: 800;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 45px;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 13px;
      color: #888;
      font-size: 12px;
    }

    .views {
      color: #bbb;
      font-weight: 700;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 45px 20px;
      border: 1px solid #292929;
      background: #111;
      border-radius: 20px;
      text-align: center;
      color: #888;
    }

    .youtube {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 62px;
      margin-top: 30px;
      padding: 15px;
      border-radius: 18px;
      background: #ff0033;
      color: #fff;
      text-decoration: none;
      font-weight: 900;
    }

    @media (min-width: 620px) {

      .grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

    @media (min-width: 900px) {

      .grid {
        grid-template-columns:
          repeat(3, 1fr);
      }

    }

  </style>

</head>

<body>

  <main class="page">

    <a
      class="back"
      href="/"
    >
      ← BİZDƏ BELƏDİR
    </a>

    <header class="header">

      <h1>
        Bütün videolar 🎬
      </h1>

      <p class="subtitle">
        Bizdə Belədir kanalının videolarını
        axtar və istədiyin qaydada sırala.
      </p>

    </header>


    <section class="controls">

      <div class="search">

        <span class="search-icon">
          🔎
        </span>

        <input
          id="search"
          type="search"
          placeholder="Video axtar..."
          autocomplete="off"
        >

      </div>


      <div class="filter-row">

        <button
          id="newest"
          class="filter-btn active"
          type="button"
        >
          🆕 Ən yeni
        </button>

        <button
          id="popular"
          class="filter-btn"
          type="button"
        >
          🔥 Ən çox baxılan
        </button>

      </div>

    </section>


    <div class="results-info">

      <span>
        <strong id="result-count">
          0
        </strong>
        video
      </span>

      <span id="sort-label">
        Ən yeni
      </span>

    </div>


    <section
      class="grid"
      id="video-grid"
    >

      <div class="empty">
        Videolar yüklənir...
      </div>

    </section>


    <a
      class="youtube"
      href="https://youtube.com/@bizde.beledir/shorts"
      target="_blank"
      rel="noopener noreferrer"
    >
      ▶ YouTube kanalına keç
    </a>

  </main>


  <script>

    let allVideos = [];

    let currentSort =
      "newest";


    const grid =
      document.getElementById(
        "video-grid"
      );

    const search =
      document.getElementById(
        "search"
      );

    const newestButton =
      document.getElementById(
        "newest"
      );

    const popularButton =
      document.getElementById(
        "popular"
      );

    const resultCount =
      document.getElementById(
        "result-count"
      );

    const sortLabel =
      document.getElementById(
        "sort-label"
      );


    function escapeHTML(text) {

      const element =
        document.createElement(
          "div"
        );

      element.textContent =
        text || "";

      return element.innerHTML;
    }


    function formatNumber(number) {

      return new Intl.NumberFormat(
        "az-AZ"
      ).format(
        Number(number) || 0
      );
    }


    function formatDate(date) {

      if (!date) {
        return "";
      }

      const parsed =
        new Date(date);

      if (
        Number.isNaN(
          parsed.getTime()
        )
      ) {
        return "";
      }

      return parsed.toLocaleDateString(
        "az-AZ",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );
    }


    function createCard(video) {

      const pageURL =
        "video/"
        + encodeURIComponent(
            video.id
          )
        + ".html";

      return `
        <a
          class="card"
          href="${pageURL}"
        >

          <div class="thumbnail">

            <img
              src="${video.thumbnail}"
              alt="${escapeHTML(video.title)}"
              loading="lazy"
              decoding="async"
            >

            <span class="play">
              ▶
            </span>

          </div>

          <div class="card-body">

            <div class="title">
              ${escapeHTML(video.title)}
            </div>

            <div class="meta">

              <span class="views">
                👁 ${formatNumber(video.views)}
              </span>

              <span>
                ${formatDate(video.publishedAt)}
              </span>

            </div>

          </div>

        </a>
      `;
    }


    function renderVideos() {

      const query =
        search.value
          .trim()
          .toLocaleLowerCase(
            "az"
          );


      let videos =
        allVideos.filter(
          video => {

            const title =
              (
                video.title || ""
              )
              .toLocaleLowerCase(
                "az"
              );

            const description =
              (
                video.description || ""
              )
              .toLocaleLowerCase(
                "az"
              );

            return (
              title.includes(query)
              ||
              description.includes(query)
            );
          }
        );


      if (
        currentSort ===
        "popular"
      ) {

        videos.sort(
          (a, b) =>
            Number(b.views || 0)
            -
            Number(a.views || 0)
        );

      } else {

        videos.sort(
          (a, b) =>
            new Date(
              b.publishedAt
            )
            -
            new Date(
              a.publishedAt
            )
        );
      }


      resultCount.textContent =
        videos.length;


      if (!videos.length) {

        grid.innerHTML = `
          <div class="empty">
            🔎 Axtarışa uyğun video tapılmadı.
          </div>
        `;

        return;
      }


      grid.innerHTML =
        videos
          .map(
            createCard
          )
          .join("");
    }


    function setSort(type) {

      currentSort =
        type;


      if (
        type ===
        "popular"
      ) {

        popularButton
          .classList
          .add(
            "active"
          );

        newestButton
          .classList
          .remove(
            "active"
          );

        sortLabel.textContent =
          "Ən çox baxılan";

      } else {

        newestButton
          .classList
          .add(
            "active"
          );

        popularButton
          .classList
          .remove(
            "active"
          );

        sortLabel.textContent =
          "Ən yeni";
      }


      renderVideos();
    }


    newestButton
      .addEventListener(
        "click",
        () => {
          setSort(
            "newest"
          );
        }
      );


    popularButton
      .addEventListener(
        "click",
        () => {
          setSort(
            "popular"
          );
        }
      );


    search
      .addEventListener(
        "input",
        renderVideos
      );


    async function loadVideos() {

      try {

        const response =
          await fetch(
            "all-videos.json",
            {
              cache:
                "no-cache"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Video məlumatları yüklənmədi."
          );
        }


        const data =
          await response.json();


        allVideos =
          Array.isArray(data)
          ? data
          : [];


        setSort(
          "newest"
        );

      } catch (error) {

        console.error(
          error
        );


        resultCount.textContent =
          "0";


        grid.innerHTML = `
          <div class="empty">
            ⚠️ Videolar hazırda yüklənə bilmir.
          </div>
        `;
      }
    }


    loadVideos();

  </script>

</body>

</html>
