name: Update YouTube Videos

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: python
        run: |
          import json
          import os
          import urllib.parse
          import urllib.request

          API_KEY = os.environ["YOUTUBE_API_KEY"]
          HANDLE = "@bizde.beledir"

          def api_get(endpoint, params):
              params["key"] = API_KEY
              url = (
                  "https://www.googleapis.com/youtube/v3/"
                  + endpoint
                  + "?"
                  + urllib.parse.urlencode(params)
              )

              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          # 1. Find the exact channel from its handle.
          channel_data = api_get(
              "channels",
              {
                  "part": "snippet,contentDetails",
                  "forHandle": HANDLE
              }
          )

          if not channel_data.get("items"):
              raise RuntimeError("YouTube channel could not be found.")

          channel = channel_data["items"][0]

          uploads_playlist = (
              channel["contentDetails"]
              ["relatedPlaylists"]
              ["uploads"]
          )

          print("Channel:", channel["snippet"]["title"])
          print("Uploads playlist:", uploads_playlist)

          # 2. Get up to 50 latest uploads.
          playlist_data = api_get(
              "playlistItems",
              {
                  "part": "snippet,contentDetails",
                  "playlistId": uploads_playlist,
                  "maxResults": 50
              }
          )

          video_ids = []

          for item in playlist_data.get("items", []):
              video_id = (
                  item.get("contentDetails", {})
                  .get("videoId")
              )

              if video_id:
                  video_ids.append(video_id)

          if not video_ids:
              raise RuntimeError("No YouTube videos found.")

          # 3. Get statistics and details for those videos.
          video_data = api_get(
              "videos",
              {
                  "part": "snippet,statistics,contentDetails",
                  "id": ",".join(video_ids)
              }
          )

          videos = []

          for item in video_data.get("items", []):
              video_id = item["id"]
              snippet = item.get("snippet", {})
              statistics = item.get("statistics", {})

              view_count = int(
                  statistics.get("viewCount", 0)
              )

              videos.append({
                  "id": video_id,
                  "title": snippet.get(
                      "title",
                      "Bizdə Belədir"
                  ),
                  "url": (
                      "https://www.youtube.com/shorts/"
                      + video_id
                  ),
                  "thumbnail": (
                      "https://i.ytimg.com/vi/"
                      + video_id
                      + "/hqdefault.jpg"
                  ),
                  "views": view_count,
                  "publishedAt": snippet.get(
                      "publishedAt",
                      ""
                  )
              })

          # 4. Sort by views, highest first.
          videos.sort(
              key=lambda video: video["views"],
              reverse=True
          )

          # Keep the top 3.
          videos = videos[:3]

          with open(
              "videos.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  videos,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Top videos:")
          for video in videos:
              print(
                  video["views"],
                  "-",
                  video["title"]
              )

      - name: Commit updated videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update YouTube videos"
          git push
