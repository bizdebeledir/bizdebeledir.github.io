name: Update YouTube Videos

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: python
        run: |
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ["YOUTUBE_API_KEY"]
          HANDLE = "@bizde.beledir"

          def api_get(endpoint, params):
              params["key"] = API_KEY

              url = (
                  "https://www.googleapis.com/youtube/v3/"
                  + endpoint
                  + "?"
                  + urllib.parse.urlencode(params)
              )

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          # =========================
          # KANAL
          # =========================

          channel_data = api_get(
              "channels",
              {
                  "part": "snippet,contentDetails,statistics",
                  "forHandle": HANDLE
              }
          )

          if not channel_data.get("items"):
              raise RuntimeError("YouTube channel not found.")

          channel = channel_data["items"][0]

          statistics = channel.get("statistics", {})

          channel_stats = {
              "channelId": channel["id"],
              "title": channel.get(
                  "snippet", {}
              ).get(
                  "title",
                  "Bizdə Belədir"
              ),
              "subscribers": int(
                  statistics.get("subscriberCount", 0)
              ),
              "views": int(
                  statistics.get("viewCount", 0)
              ),
              "videos": int(
                  statistics.get("videoCount", 0)
              ),
              "hiddenSubscriberCount":
                  statistics.get(
                      "hiddenSubscriberCount",
                      False
                  )
          }

          with open(
              "channel-stats.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  channel_stats,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          # =========================
          # SON 50 VİDEO
          # =========================

          uploads_playlist = (
              channel["contentDetails"]
              ["relatedPlaylists"]
              ["uploads"]
          )

          playlist_data = api_get(
              "playlistItems",
              {
                  "part": "snippet,contentDetails",
                  "playlistId": uploads_playlist,
                  "maxResults": 50
              }
          )

          video_ids = []

          for item in playlist_data.get("items", []):
              video_id = (
                  item.get("contentDetails", {})
                  .get("videoId")
              )

              if video_id:
                  video_ids.append(video_id)

          if not video_ids:
              raise RuntimeError("No videos found.")

          video_data = api_get(
              "videos",
              {
                  "part":
                      "snippet,statistics,contentDetails",
                  "id": ",".join(video_ids)
              }
          )

          all_videos = []

          for item in video_data.get("items", []):

              video_id = item["id"]

              snippet = item.get("snippet", {})
              stats = item.get("statistics", {})
              content = item.get("contentDetails", {})

              all_videos.append({
                  "id": video_id,

                  "title": snippet.get(
                      "title",
                      "Bizdə Belədir"
                  ),

                  "description": snippet.get(
                      "description",
                      ""
                  ),

                  "url":
                      "https://www.youtube.com/watch?v="
                      + video_id,

                  "shortsUrl":
                      "https://www.youtube.com/shorts/"
                      + video_id,

                  "embedUrl":
                      "https://www.youtube.com/embed/"
                      + video_id,

                  "thumbnail":
                      "https://i.ytimg.com/vi/"
                      + video_id
                      + "/hqdefault.jpg",

                  "views": int(
                      stats.get("viewCount", 0)
                  ),

                  "publishedAt": snippet.get(
                      "publishedAt",
                      ""
                  ),

                  "duration": content.get(
                      "duration",
                      ""
                  )
              })

          if not all_videos:
              raise RuntimeError("No video details found.")

          # Yeni videolar birinci

          all_videos.sort(
              key=lambda video: video["publishedAt"],
              reverse=True
          )

          with open(
              "all-videos.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  all_videos,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          # =========================
          # TOP 3
          # =========================

          top_videos = sorted(
              all_videos,
              key=lambda video: video["views"],
              reverse=True
          )[:3]

          with open(
              "videos.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  top_videos,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          # =========================
          # SITEMAP
          # =========================

          today = datetime.now(
              timezone.utc
          ).strftime("%Y-%m-%d")

          sitemap = f"""<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://bizdebeledir.github.io/</loc>
              <lastmod>{today}</lastmod>
            </url>
          </urlset>
          """

          with open(
              "sitemap.xml",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(sitemap.strip() + "\n")

          print("Channel:", channel_stats["title"])
          print("Subscribers:", channel_stats["subscribers"])
          print("Total views:", channel_stats["views"])
          print("Videos:", channel_stats["videos"])
          print("Saved videos:", len(all_videos))
          print("Sitemap updated:", today)

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos.json all-videos.json channel-stats.json sitemap.xml

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update YouTube data and sitemap"
          git push
