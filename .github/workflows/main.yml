name: Update YouTube Videos

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: python
        run: |
          import json
          import os
          import urllib.parse
          import urllib.request

          API_KEY = os.environ["YOUTUBE_API_KEY"]
          HANDLE = "@bizde.beledir"

          def api_get(endpoint, params):
              params["key"] = API_KEY

              url = (
                  "https://www.googleapis.com/youtube/v3/"
                  + endpoint
                  + "?"
                  + urllib.parse.urlencode(params)
              )

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          # Kanalı handle vasitəsilə tap
          channel_data = api_get(
              "channels",
              {
                  "part": "snippet,contentDetails",
                  "forHandle": HANDLE
              }
          )

          if not channel_data.get("items"):
              raise RuntimeError(
                  "YouTube channel could not be found."
              )

          channel = channel_data["items"][0]

          uploads_playlist = (
              channel["contentDetails"]
              ["relatedPlaylists"]
              ["uploads"]
          )

          print(
              "Channel:",
              channel["snippet"]["title"]
          )

          # Son 50 videonu götür
          playlist_data = api_get(
              "playlistItems",
              {
                  "part": "snippet,contentDetails",
                  "playlistId": uploads_playlist,
                  "maxResults": 50
              }
          )

          video_ids = []

          for item in playlist_data.get("items", []):
              video_id = (
                  item.get("contentDetails", {})
                  .get("videoId")
              )

              if video_id:
                  video_ids.append(video_id)

          if not video_ids:
              raise RuntimeError(
                  "No YouTube videos found."
              )

          # Video məlumatları və baxış sayı
          video_data = api_get(
              "videos",
              {
                  "part": "snippet,statistics,contentDetails",
                  "id": ",".join(video_ids)
              }
          )

          all_videos = []

          for item in video_data.get("items", []):
              video_id = item["id"]

              snippet = item.get(
                  "snippet",
                  {}
              )

              statistics = item.get(
                  "statistics",
                  {}
              )

              views = int(
                  statistics.get(
                      "viewCount",
                      0
                  )
              )

              all_videos.append({
                  "id": video_id,
                  "title": snippet.get(
                      "title",
                      "Bizdə Belədir"
                  ),
                  "url": (
                      "https://www.youtube.com/shorts/"
                      + video_id
                  ),
                  "thumbnail": (
                      "https://i.ytimg.com/vi/"
                      + video_id
                      + "/hqdefault.jpg"
                  ),
                  "views": views,
                  "publishedAt": snippet.get(
                      "publishedAt",
                      ""
                  )
              })

          if not all_videos:
              raise RuntimeError(
                  "No video details found."
              )

          # Yeni videolar birinci
          all_videos.sort(
              key=lambda video: video["publishedAt"],
              reverse=True
          )

          # Təsadüfi video sistemi üçün son 50
          with open(
              "all-videos.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  all_videos,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          # Baxış sayına görə TOP 3
          top_videos = sorted(
              all_videos,
              key=lambda video: video["views"],
              reverse=True
          )[:3]

          with open(
              "videos.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  top_videos,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Saved",
              len(all_videos),
              "videos to all-videos.json"
          )

          print("TOP 3:")

          for video in top_videos:
              print(
                  video["views"],
                  "-",
                  video["title"]
              )

      - name: Commit updated videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos.json all-videos.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update YouTube video data"
          git push
