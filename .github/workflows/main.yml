name: Update YouTube Videos

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: python
        run: |
          import json
          import os
          import urllib.parse
          import urllib.request

          API_KEY = os.environ["YOUTUBE_API_KEY"]
          HANDLE = "@bizde.beledir"

          def api_get(endpoint, params):
              params["key"] = API_KEY

              url = (
                  "https://www.googleapis.com/youtube/v3/"
                  + endpoint
                  + "?"
                  + urllib.parse.urlencode(params)
              )

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          # ==========================================
          # 1. KANAL MƏLUMATLARI
          # ==========================================

          channel_data = api_get(
              "channels",
              {
                  "part": "snippet,contentDetails,statistics",
                  "forHandle": HANDLE
              }
          )

          if not channel_data.get("items"):
              raise RuntimeError(
                  "YouTube channel could not be found."
              )

          channel = channel_data["items"][0]

          channel_id = channel["id"]

          channel_title = (
              channel
              .get("snippet", {})
              .get("title", "Bizdə Belədir")
          )

          statistics = channel.get(
              "statistics",
              {}
          )

          subscriber_count = int(
              statistics.get(
                  "subscriberCount",
                  0
              )
          )

          total_views = int(
              statistics.get(
                  "viewCount",
                  0
              )
          )

          video_count = int(
              statistics.get(
                  "videoCount",
                  0
              )
          )

          hidden_subscribers = (
              statistics.get(
                  "hiddenSubscriberCount",
                  False
              )
          )

          # Kanal statistikasını ayrıca saxla

          channel_stats = {
              "channelId": channel_id,
              "title": channel_title,
              "subscribers": subscriber_count,
              "views": total_views,
              "videos": video_count,
              "hiddenSubscriberCount": hidden_subscribers
          }

          with open(
              "channel-stats.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  channel_stats,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("CHANNEL STATS")
          print("Subscribers:", subscriber_count)
          print("Total views:", total_views)
          print("Videos:", video_count)

          # ==========================================
          # 2. UPLOADS PLAYLIST
          # ==========================================

          uploads_playlist = (
              channel["contentDetails"]
              ["relatedPlaylists"]
              ["uploads"]
          )

          playlist_data = api_get(
              "playlistItems",
              {
                  "part": "snippet,contentDetails",
                  "playlistId": uploads_playlist,
                  "maxResults": 50
              }
          )

          video_ids = []

          for item in playlist_data.get(
              "items",
              []
          ):
              video_id = (
                  item
                  .get("contentDetails", {})
                  .get("videoId")
              )

              if video_id:
                  video_ids.append(video_id)

          if not video_ids:
              raise RuntimeError(
                  "No YouTube videos found."
              )

          # ==========================================
          # 3. VİDEO MƏLUMATLARI
          # ==========================================

          video_data = api_get(
              "videos",
              {
                  "part":
                      "snippet,statistics,contentDetails",
                  "id": ",".join(video_ids)
              }
          )

          all_videos = []

          for item in video_data.get(
              "items",
              []
          ):
              video_id = item["id"]

              snippet = item.get(
                  "snippet",
                  {}
              )

              video_statistics = item.get(
                  "statistics",
                  {}
              )

              views = int(
                  video_statistics.get(
                      "viewCount",
                      0
                  )
              )

              all_videos.append({
                  "id": video_id,

                  "title": snippet.get(
                      "title",
                      "Bizdə Belədir"
                  ),

                  "url":
                      "https://www.youtube.com/shorts/"
                      + video_id,

                  "thumbnail":
                      "https://i.ytimg.com/vi/"
                      + video_id
                      + "/hqdefault.jpg",

                  "views": views,

                  "publishedAt": snippet.get(
                      "publishedAt",
                      ""
                  )
              })

          if not all_videos:
              raise RuntimeError(
                  "No video details found."
              )

          # ==========================================
          # 4. SON VİDEOLAR
          # ==========================================

          all_videos.sort(
              key=lambda video:
                  video["publishedAt"],
              reverse=True
          )

          with open(
              "all-videos.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  all_videos,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          # ==========================================
          # 5. TOP 3
          # ==========================================

          top_videos = sorted(
              all_videos,
              key=lambda video:
                  video["views"],
              reverse=True
          )[:3]

          with open(
              "videos.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  top_videos,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Saved",
              len(all_videos),
              "videos."
          )

          print("TOP 3")

          for video in top_videos:
              print(
                  video["views"],
                  "-",
                  video["title"]
              )

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos.json all-videos.json channel-stats.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update YouTube data"
          git push
